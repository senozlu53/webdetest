<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Stil 006: Ambient UI. Akan aurora mesh gradyanları, gölge yerine parıltı, sıvı yükleme göstergeleri, form değiştiren kapsayıcılar ve pil dostu hareket modları." />
    <meta name="theme-color" content="#05040d" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Cdefs%3E%3CradialGradient id='g' cx='.3' cy='.3' r='.9'%3E%3Cstop offset='0' stop-color='%2322D3EE'/%3E%3Cstop offset='.5' stop-color='%237C3AED'/%3E%3Cstop offset='1' stop-color='%23F472B6'/%3E%3C/radialGradient%3E%3C/defs%3E%3Crect width='16' height='16' rx='8' fill='url(%23g)'/%3E%3C/svg%3E" />
    <title>Stil 006 · Ambient UI</title>
    <script>
      try {
        var d = document.documentElement
        var t = localStorage.getItem('ambient-theme')
        if (t === 'light' || t === 'dark') d.dataset.theme = t
        var m = localStorage.getItem('ambient-motion')
        if (m === 'live' || m === 'lite' || m === 'paused') d.dataset.motion = m
        else if (matchMedia('(prefers-reduced-motion: reduce)').matches) d.dataset.motion = 'paused'
        else if (matchMedia('(max-width: 767px)').matches) d.dataset.motion = 'lite'
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/ambient/main.tsx"></script>
  </body>
</html>
