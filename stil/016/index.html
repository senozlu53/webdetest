<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Stil 016: Neo-Brutalism. Kalın siyah çerçeve, bulanıklığı sıfır ofset gölge, devasa yazı ve düz renk: SolidButton, BrutalistCard, Marquee, büyük etiketler; mağaza, geliştirici aracı, ajans ve Web3 örnekleri." />
    <meta name="theme-color" content="#F4F4F0" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='5' y='5' width='25' height='25' fill='%23000'/%3E%3Crect x='2' y='2' width='25' height='25' fill='%23FFD500' stroke='%23000' stroke-width='3'/%3E%3Cpath d='M9 9h7a4 4 0 0 1 0 8H9zM9 17h8a4 4 0 0 1 0 8H9z' fill='none' stroke='%23000' stroke-width='3'/%3E%3C/svg%3E" />
    <title>Stil 016 · Neo-Brutalism</title>
    <script>
      try {
        var d = document.documentElement
        var t = localStorage.getItem('brut-theme')
        if (t === 'light' || t === 'dark') d.dataset.theme = t
        d.dataset.zemin = localStorage.getItem('brut-zemin') === 'sari' ? 'sari' : 'kirli'
        d.dataset.kose = localStorage.getItem('brut-kose') === 'yuvarlak' ? 'yuvarlak' : 'keskin'
        var m = localStorage.getItem('brut-motion')
        d.dataset.motion = m === 'kapali' || (m !== 'acik' && matchMedia('(prefers-reduced-motion: reduce)').matches) ? 'off' : 'on'
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/brut/main.tsx"></script>
  </body>
</html>
