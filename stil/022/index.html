    <title>Stil 022 · Memphis Design</title>
    <script>
      try {
        var d = document.documentElement
        var m = localStorage.getItem('mem-hareket')
        d.dataset.motion = m === 'kapali' || (m !== 'acik' && matchMedia('(prefers-reduced-motion: reduce)').matches) ? 'off' : 'on'
        d.dataset.kontrast = localStorage.getItem('mem-kontrast') === 'yuksek' ? 'yuksek' : 'standart'
        d.dataset.desen = localStorage.getItem('mem-desen') === '1' ? '1' : '0'
        var c = localStorage.getItem('mem-cvd')
        d.dataset.cvd = c === 'protan' || c === 'deutan' || c === 'tritan' || c === 'akromat' ? c : 'yok'
      } catch (e) {}
    </script>
