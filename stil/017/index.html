<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Stil 017: Maximalism. Boşluk korkusu: üst üste binen dev yazılar, 3D nesneler, çıkartmalar, halftone ve holografik doku, çatışan neonlar. Festival programı, sonsuz galeri, moda kampanyası ve editoryal örnekler." />
    <meta name="theme-color" content="#FFF3E3" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0B0A0F" media="(prefers-color-scheme: dark)" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%230B0A0F'/%3E%3Cpath d='M16 2l3 7 7-2-3 7 7 3-7 3 3 7-7-2-3 7-3-7-7 2 3-7-7-3 7-3-3-7 7 2z' fill='%23FF2E93'/%3E%3Ccircle cx='16' cy='16' r='5' fill='%23C8FF00'/%3E%3C/svg%3E" />
    <title>Stil 017 · Maximalism</title>
    <script>
      try {
        var d = document.documentElement
        var t = localStorage.getItem('maxi-theme')
        if (t === 'light' || t === 'dark') d.dataset.theme = t
        var k = localStorage.getItem('maxi-kaos')
        d.dataset.kaos = k === 'sakin' || k === 'tam' || k === 'ozel' ? k : 'normal'
        var m = localStorage.getItem('maxi-motion')
        d.dataset.motion = m === 'kapali' || (m !== 'acik' && matchMedia('(prefers-reduced-motion: reduce)').matches) ? 'off' : 'on'
        // Kayıtlı değişken yoksa kaos düzeyinin hazır ayarı (store.tsx PRESETS ile aynı)
        var p = { sakin: [0, 0, 90, 0, 2, 0.5], tam: [28, 100, 150, 70, 4, 1.6] }[d.dataset.kaos]
        var v = JSON.parse(localStorage.getItem('maxi-vars') || 'null') || (p && { donme: p[0], binme: p[1], doygunluk: p[2], gren: p[3], font: p[4], hiz: p[5] })
        if (v) {
          d.style.setProperty('--rot-max', v.donme + 'deg')
          d.style.setProperty('--overlap', String(v.binme / 100))
          d.style.setProperty('--sat', v.doygunluk + '%')
          d.style.setProperty('--grain', String(v.gren / 100))
          d.style.setProperty('--speed', String(v.hiz))
          d.dataset.fontmix = String(v.font)
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/maxi/main.tsx"></script>
  </body>
</html>
