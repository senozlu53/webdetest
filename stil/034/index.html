<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Stil 034: Kinetic Typography. Saf siyah zemin, saf beyaz metin ve tek bir neon vurgu; kaydırma hızıyla esneyen, dalgalanan ve Z ekseninde hareket eden dev harfler, sonsuz maruz şeritleri, imleci izleyen başlıklar, geniş ağırlıklı Syne ile Inter." />
    <meta name="theme-color" content="#000000" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'%3E%3Crect width='48' height='48' fill='%23000'/%3E%3Cpath d='M9 34L17 12H21L29 34H24.500L23 29.500H15L13.500 34ZM16.200 26H21.800L19 17.500Z' fill='%23fff'/%3E%3Crect x='32' y='30' width='8' height='4' fill='%23CCFF00'/%3E%3C/svg%3E"
    />
    <title>Stil 034 · Kinetic Typography</title>
    <script>
      try {
        var d = document.documentElement
        var g = function (k) {
          return localStorage.getItem(k)
        }
        var m = g('kt-hareket')
        d.dataset.motion = m === 'kapali' || (m !== 'acik' && matchMedia('(prefers-reduced-motion: reduce)').matches) ? 'off' : 'on'
        d.dataset.siddet = g('kt-siddet') === 'hafif' ? 'hafif' : 'tam'
        d.dataset.tema = g('kt-tema') === 'ak' ? 'ak' : 'kara'
        d.dataset.vurgu = g('kt-vurgu') === 'kirmizi' ? 'kirmizi' : 'asit'
        d.dataset.kontrast = g('kt-kontrast') === 'yuksek' ? 'yuksek' : 'normal'
        var h = g('kt-hiz')
        d.dataset.hiz = h === 'yavas' || h === 'hizli' ? h : 'normal'
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/kinetic/main.tsx"></script>
  </body>
</html>
