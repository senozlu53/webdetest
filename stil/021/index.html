<!doctype html>
<html lang="tr" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Stil 021: Pixel Art &amp; CRT (Arcade Aesthetic). Saf siyah zemin, doygun kırmızı, Atari sarısı ve saf yeşil; kenar yumuşatmasız piksel yazılar, tarama çizgileri, renk sapması, blok gölgeler, sprite animasyonları ve tam sayı ölçek: espor turnuvası, yüksek skor tablosu, oyun ve RPG arayüzü." />
    <meta name="theme-color" content="#000000" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16' shape-rendering='crispEdges'%3E%3Crect width='16' height='16' fill='%23000'/%3E%3Cpath fill='%23FFEA00' d='M6 2h4v1h2v2h1v6h-1v2h-2v1H6v-1H4v-2H3V5h1V3h2z'/%3E%3Cpath fill='%237F7500' d='M10 4h1v8h-1z'/%3E%3Cpath fill='%23000' d='M7 5h2v6H7z'/%3E%3C/svg%3E" />
    <title>Stil 021 · Pixel Art &amp; CRT</title>
    <script>
      var d = document.documentElement
      try {
        d.dataset.theme = localStorage.getItem('arc-theme') === 'light' ? 'light' : 'dark'
        var m = localStorage.getItem('arc-hareket')
        d.dataset.motion = m === 'kapali' || (m !== 'acik' && matchMedia('(prefers-reduced-motion: reduce)').matches) ? 'off' : 'on'
        d.dataset.crt = localStorage.getItem('arc-crt') === '0' ? '0' : '1'
        var o = localStorage.getItem('arc-olcek')
        var w = innerWidth
        var k = o === '2' || o === '3' || o === '4' ? Math.min(+o, Math.max(2, Math.floor(w / 110))) : w < 768 ? 2 : w < 1440 ? 3 : 4
        var r = devicePixelRatio || 1
        d.dataset.k = k
        d.style.setProperty('--u', Math.max(1, Math.round(k * r)) / r + 'px')
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/arcade/main.tsx"></script>
  </body>
</html>
