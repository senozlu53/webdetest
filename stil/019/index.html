  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Stil 019: Y2K (2000s Millennium Aesthetic). Krom logolar, buz mavisi ve sakız pembesi, parlak kapsül düğmeler, uçuşan CD'ler, kabile desenleri ve hızlı açılan pop-up pencereler: müzik platformu, moda mağazası ve pop portfolyosu." />
    <meta name="theme-color" content="#A5F2F3" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#12052B" media="(prefers-color-scheme: dark)" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%23fff'/%3E%3Cstop offset='.5' stop-color='%23B0C4DE'/%3E%3Cstop offset='1' stop-color='%23778899'/%3E%3C/linearGradient%3E%3C/defs%3E%3Ccircle cx='16' cy='16' r='15' fill='url(%23g)' stroke='%232E0854' stroke-width='1.5'/%3E%3Ccircle cx='16' cy='16' r='4' fill='%23FF66CC' stroke='%232E0854'/%3E%3Cpath d='M9 9a9 9 0 0 1 6-3' stroke='%23fff' stroke-width='2' fill='none' stroke-linecap='round'/%3E%3C/svg%3E" />
    <title>Stil 019 · Y2K</title>
    <script>
      try {
        var d = document.documentElement
        var t = localStorage.getItem('y2k-theme')
        if (t === 'light' || t === 'dark') d.dataset.theme = t
        var m = localStorage.getItem('y2k-motion')
        d.dataset.motion = m === 'kapali' || (m !== 'acik' && matchMedia('(prefers-reduced-motion: reduce)').matches) ? 'off' : 'on'
        d.dataset.sade = localStorage.getItem('y2k-sade') === '1' ? '1' : '0'
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/y2k/main.tsx"></script>
  </body>
</html>
