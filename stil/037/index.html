  <head>
    <meta charset="UTF-8" />

    <meta name="theme-color" content="#1e1e24" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'%3E%3Crect width='48' height='48' fill='%231e1e24'/%3E%3Cpath d='M24 4L42 10V24C42 34 34 41 24 45C14 41 6 34 6 24V10Z' fill='%23d4af37'/%3E%3Cpath d='M24 9L37 13.500V24C37 31.500 31.500 37 24 40.500C16.500 37 11 31.500 11 24V13.500Z' fill='%238b0000'/%3E%3C/svg%3E"
    />
    <title>Stil 037 · MMORPG Fantasy UI</title>
    <script>
      try {
        var d = document.documentElement
        var g = function (k) {
          return localStorage.getItem(k)
        }
        var m = g('fa-hareket')
        d.dataset.motion = m === 'kapali' || (m !== 'acik' && matchMedia('(prefers-reduced-motion: reduce)').matches) ? 'off' : 'on'
        d.dataset.tema = g('fa-tema') === 'parsomen' ? 'parsomen' : 'zindan'
        d.dataset.kontrast = g('fa-kontrast') === 'yuksek' ? 'yuksek' : 'normal'
        var s = g('fa-suslenme')
        d.dataset.suslenme = s === 'tam' || s === 'sade' || s === 'yok' ? s : 'oto'
        d.dataset.parcacik = g('fa-parcacik') === 'kapali' ? 'kapali' : 'acik'
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/fantasy/main.tsx"></script>
  </body>
