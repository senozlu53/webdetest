    <title>Stil 023 · Synthwave</title>
    <script>
      try {
        var d = document.documentElement
        var m = localStorage.getItem('syn-hareket')
        d.dataset.motion = m === 'kapali' || (m !== 'acik' && matchMedia('(prefers-reduced-motion: reduce)').matches) ? 'off' : 'on'
        d.dataset.parlama = localStorage.getItem('syn-parlama') === 'az' ? 'az' : 'tam'
        d.dataset.vhs = localStorage.getItem('syn-vhs') === '0' ? '0' : '1'
      } catch (e) {}
    </script>
