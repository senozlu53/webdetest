<html lang="tr">
  <head>
    <meta charset="UTF-8" />

    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%23A78BFA'/%3E%3Cstop offset='1' stop-color='%2322D3EE'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='16' height='16' rx='5' fill='url(%23g)'/%3E%3C/svg%3E" />
    <title>Stil 004 · Glassmorphism</title>
    <script>
      try {
        var t = localStorage.getItem('glass-theme')
        if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t
        if (localStorage.getItem('glass-transparency') === 'reduced') document.documentElement.dataset.transparency = 'reduced'
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/glass/main.tsx"></script>
  </body>
