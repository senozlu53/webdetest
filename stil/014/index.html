<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="description" content="Stil 014: Conversational UI. Gezinme yok; bütün deneyim bir mesaj akışı ve altta sabit bir komut kutusu: öneri çipleri, düşünme adımları, dosya eki ve sesle yazma, aria-live duyuruları." />
    <meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#141517" media="(prefers-color-scheme: dark)" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%232563EB'/%3E%3Cpath d='M8 9.5A2.5 2.5 0 0 1 10.5 7h11A2.5 2.5 0 0 1 24 9.5v8a2.5 2.5 0 0 1-2.5 2.5H15l-5 4v-4a2 2 0 0 1-2-2z' fill='%23fff'/%3E%3C/svg%3E" />
    <title>Stil 014 · Conversational UI</title>
    <script>
      try {
        var d = document.documentElement
        var t = localStorage.getItem('chat-theme')
        if (t === 'light' || t === 'dark') d.dataset.theme = t
        var b = localStorage.getItem('chat-brand')
        d.dataset.brand = b === 'mor' || b === 'yesil' || b === 'mercan' ? b : 'mavi'
        var u = localStorage.getItem('chat-bubble')
        d.dataset.bubble = u === 'kuyruk' || u === 'yuvarlak' ? u : 'sivri'
        var m = localStorage.getItem('chat-motion')
        d.dataset.motion = m === 'kapali' || (m !== 'acik' && matchMedia('(prefers-reduced-motion: reduce)').matches) ? 'off' : 'on'
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/chat/main.tsx"></script>
  </body>
</html>
