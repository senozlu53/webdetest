<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Stil 010: Cyberpunk. #050509 zemin, agresif neon vurgular, kesik köşeli kartlar, glitch'li form alanları, neon ilerleme çubukları, HUD terminali ve radar." />
    <meta name="theme-color" content="#050509" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M6 2h20l4 4v20l-4 4H6l-4-4V6z' fill='%23050509' stroke='%2300F0FF' stroke-width='2'/%3E%3Cpath d='M10 22V10l6 7 6-7v12' fill='none' stroke='%23FF00A8' stroke-width='2'/%3E%3C/svg%3E" />
    <title>Stil 010 · Cyberpunk</title>
    <script>
      try {
        var d = document.documentElement
        var t = localStorage.getItem('cyber-theme')
        if (t === 'light' || t === 'dark') d.dataset.theme = t
        var f = localStorage.getItem('cyber-fx')
        if (f === 'tam' || f === 'sade' || f === 'kapali') d.dataset.fx = f
        else if (matchMedia('(prefers-reduced-motion: reduce)').matches) d.dataset.fx = 'kapali'
        else if (matchMedia('(max-width: 767px)').matches) d.dataset.fx = 'sade'
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/cyber/main.tsx"></script>
  </body>
</html>
