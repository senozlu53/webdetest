<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Stil 028: Art Deco. Gece siyahı ve derin lacivert zeminde ince altın çizgiler, yelpaze ve güneş ışını motifleri, simetrik çerçeveler, Cinzel ve Playfair Display: lüks otel, restoran, mücevher, couture ve özel kulüp." />
    <meta name="theme-color" content="#0B0B0B" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'%3E%3Crect width='48' height='48' fill='%230B0B0B'/%3E%3Cg fill='none' stroke='%23D4AF37' stroke-width='1.6'%3E%3Cpath d='M6 40H42M24 40V10M24 40L10 16M24 40L38 16M24 40L4 28M24 40L44 28'/%3E%3Cpath d='M8 40A16 16 0 0 1 40 40'/%3E%3C/g%3E%3C/svg%3E" />
    <title>Stil 028 · Art Deco</title>
    <script>
      try {
        var d = document.documentElement
        var g = function (k) {
          return localStorage.getItem(k)
        }
        var m = g('dc-hareket')
        d.dataset.motion = m === 'kapali' || (m !== 'acik' && matchMedia('(prefers-reduced-motion: reduce)').matches) ? 'off' : 'on'
        var t = g('dc-tema')
        d.dataset.tema = t === 'lacivert' || t === 'zumrut' || t === 'fildisi' ? t : t === 'oto' && matchMedia('(prefers-color-scheme: light)').matches ? 'fildisi' : 'siyah'
        var k = g('dc-doku')
        d.dataset.doku = k === 'mermer' || k === 'firca' || k === 'duz' ? k : 'kadife'
        d.dataset.kontrast = g('dc-kontrast') === 'yuksek' ? 'yuksek' : 'normal'
        d.dataset.iz = g('dc-iz') === 'dar' ? 'dar' : 'genis'
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/deco/main.tsx"></script>
  </body>
</html>
