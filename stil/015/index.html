    <title>Stil 015 · Neural Aesthetic</title>
    <script>
      try {
        var d = document.documentElement
        var f = localStorage.getItem('neural-fx')
        d.dataset.fx = f === 'sade' ? 'sade' : 'tam'
        var c = localStorage.getItem('neural-contrast')
        d.dataset.contrast = c === 'yuksek' ? 'yuksek' : 'normal'
        var m = localStorage.getItem('neural-motion')
        d.dataset.motion = m === 'kapali' || (m !== 'acik' && matchMedia('(prefers-reduced-motion: reduce)').matches) ? 'off' : 'on'
      } catch (e) {}
    </script>
