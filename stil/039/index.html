<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Stil 039: Dark Fantasy (Gothic UI). Sivri gotik kemerler, paslı zincirlerle asılı kartlar, kan damlalı yükleme barı, kuru kan kırmızısı ve pas rengi ayrıntılar, titreyen mum ışığı; Pirata One, Grenze Gotisch ve Spectral." />
    <meta name="theme-color" content="#0a0a0c" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'%3E%3Crect width='48' height='48' fill='%230a0a0c'/%3E%3Cpath d='M10 44V22Q10 12 24 4Q38 12 38 22V44Z' fill='%235c0606' stroke='%23a0a0a0' stroke-width='2.500'/%3E%3Cpath d='M24 14V40M17 24H31' stroke='%23d1d5db' stroke-width='3'/%3E%3C/svg%3E"
    />
    <title>Stil 039 · Dark Fantasy Gothic UI</title>
    <script>
      try {
        var d = document.documentElement
        var g = function (k) {
          return localStorage.getItem(k)
        }
        var m = g('gt-hareket')
        d.dataset.motion = m === 'kapali' || (m !== 'acik' && matchMedia('(prefers-reduced-motion: reduce)').matches) ? 'off' : 'on'
        d.dataset.vurgu = g('gt-vurgu') === 'pas' ? 'pas' : 'kan'
        d.dataset.kontrast = g('gt-kontrast') === 'yuksek' ? 'yuksek' : 'normal'
        var a = g('gt-sus')
        d.dataset.aci = a === 'tam' || a === 'duz' ? a : 'oto'
        d.dataset.doku = g('gt-doku') === 'kapali' ? 'kapali' : 'acik'
        d.dataset.sizinti = g('gt-sizinti') === 'kapali' ? 'kapali' : 'acik'
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/gothic/main.tsx"></script>
  </body>
</html>
